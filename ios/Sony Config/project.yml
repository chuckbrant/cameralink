name: Sony Config
options:
  bundleIdPrefix: com.chuckbrant
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: DW433867N7
targets:
  Sony Config:
    type: application
    platform: iOS
    sources:
      - path: Sony Config
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chuckbrant.SonyConfig
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sony Config/Info.plist
      properties:
        CFBundleDisplayName: "Sony Config"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: NO
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: "Sony Config talks to the cameralink Pi over your local network (Wi-Fi or the USB-C gadget link) to control a connected Sony camera."
        # The cameralink server is plain HTTP (no TLS) on a local Wi-Fi
        # access point or USB gadget link -- App Transport Security blocks
        # non-TLS requests by default, so it's disabled here. Fine for a
        # local-network-only tool; would need real TLS to ship publicly.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: YES
