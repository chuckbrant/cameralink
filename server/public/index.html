<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cameralink</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; margin: 0 auto; padding: 20px; max-width: 720px; width: 100%; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .status { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex-shrink: 0; }
  .dot.on { background: #4caf50; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:active { background: #3a3a3a; }
  button.small { padding: 5px 10px; font-size: 12px; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.danger { background: #3a1a1a; border-color: #663333; color: #ff8080; }
  button.danger:active { background: #4a2020; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .row label { width: 110px; font-size: 14px; flex-shrink: 0; }
  .row input[type=range] { flex: 1; }
  .row .val { width: 28px; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
  select { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px; font-size: 14px; }
  .section { margin-top: 28px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .saved-camera-row { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .wb { font-size: 13px; color: #aaa; margin-top: 4px; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .group-heading { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.03em; margin: 20px 0 8px; }
  .group-heading:first-child { margin-top: 0; }
  .tabs { display: flex; gap: 2px; background: #333; border-radius: 10px; padding: 3px; margin-bottom: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tabs button { flex-shrink: 0; white-space: nowrap; background: transparent; border: none; color: #ccc; font-size: 13px; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .tabs button.active { background: #fff; color: #111; font-weight: 600; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card-head .name { font-weight: 600; font-size: 15px; }
  .card-head .look { font-size: 12px; color: #888; }
  .card .notes { font-size: 12px; color: #999; margin: 8px 0; line-height: 1.4; }
  .card .meta { font-size: 12px; color: #777; margin-bottom: 8px; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .specs .spec { background: #222; border: 1px solid #333; border-radius: 6px; padding: 3px 7px; font-size: 11px; color: #ccc; white-space: nowrap; }
  .specs .spec b { color: #888; font-weight: 600; margin-right: 4px; }
  .wb-grid-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 16px 0; }
  .wb-grid-readout { font-size: 13px; color: #ccc; }
  .wb-grid-outer { display: grid; grid-template-columns: 34px 210px 34px; grid-template-rows: 34px 210px 34px; gap: 4px; align-items: center; justify-items: center; }
  .wb-grid-arrow { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; width: 34px; height: 34px; padding: 0; font-size: 14px; color: #ccc; cursor: pointer; }
  .wb-grid-arrow:active { background: #3a3a3a; }
  #wbGridCanvas { border-radius: 6px; cursor: pointer; touch-action: none; }
  .tone-curve-wrap { margin: 4px 0 20px; }
  .tone-curve-wrap .row { margin-top: 12px; }
  #toneCurveCanvas { display: block; margin: 0 auto; border-radius: 4px; touch-action: none; cursor: pointer; max-width: 100%; }
  .tone-curve-labels { display: flex; justify-content: space-between; max-width: 280px; margin: 4px auto 0; }
  .tc-label { font-size: 10px; color: #888; }
  .tone-curve-readout { text-align: center; font-size: 12px; color: #aaa; margin-top: 10px; }
  .tone-curve-hint { font-size: 11px; color: #777; margin-top: 8px; line-height: 1.4; }
  .tone-curve-presets { margin-top: 12px; }
  .netform { display: none; flex-direction: column; gap: 8px; margin-top: 10px; }
  .netform.open { display: flex; }
  .netform input { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  .footer { margin-top: 32px; }
  .log-panel {
    background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5;
    color: #9fd89f; height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    margin: 0;
  }
  .confirm { display: none; margin-top: 10px; font-size: 13px; color: #999; }
  .confirm.open { display: block; }
  .confirm .actions { display: flex; gap: 10px; margin-top: 8px; }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(40,40,40,0.95); border: 1px solid #444; border-radius: 999px;
    padding: 10px 18px; font-size: 13px; color: #eee; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4); opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease; z-index: 1000; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .toast-check { color: #4caf50; font-weight: 700; }
</style>
</head>
<body>
  <div class="toast" id="toast"><span class="toast-check">&#10003;</span><span id="toastText"></span></div>
  <h1>cameralink</h1>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">Not connected</span>
  </div>

  <div class="section">
    <div class="tabs" id="mainTabs"></div>
    <div id="tabContent"></div>
  </div>

  <script>
    // Sony's own 2-letter Creative Look codes, mapped to their real names --
    // used both for the Custom tab's preset dropdown and for the "look"
    // badge on preset cards, so nobody has to know what "VV2" means.
    const presetNames = {
      "ST": "Standard", "PT": "Portrait", "NT": "Neutral", "VV": "Vivid",
      "VV2": "Vivid 2", "FL": "Film", "IN": "Instant", "SH": "Soft Highkey",
      "BW": "Black & White", "SE": "Sepia",
      "CS1": "Custom 1", "CS2": "Custom 2", "CS3": "Custom 3",
      "CS4": "Custom 4", "CS5": "Custom 5", "CS6": "Custom 6",
    };

    // Contrast/Highlights/Shadows/Fade are handled by the tone curve widget
    // below instead of plain sliders -- these four are the ones left as
    // regular sliders.
    const fields = [
      ["saturation", "Saturation", -9, 9],
      ["sharpness", "Sharpness", 0, 9],
      ["sharpnessRange", "Sharpness Range", 1, 5],
      ["clarity", "Clarity", 0, 9],
    ];

    // Tone curve widget: replaces plain Contrast/Highlights/Shadows/Fade
    // sliders with a visual curve, matching the standard photo-editing
    // mental model (S-curve for contrast, localized shadow/highlight
    // lifts, black-point lift for fade) -- NOT a literal readout of
    // anything Sony's SDK exposes as an actual curve; Creative Look is 4
    // independent scalar properties, not real curve control points. This
    // is a visualization built from those 4 values, drawn with a formula
    // chosen to look right, not derived from Sony's own tone-mapping math
    // (which isn't published).
    let curveState = { contrast: 0, highlights: 0, shadows: 0, fade: 0 };

    function tcContrastCurve(x, contrast) {
      const k = (contrast / 9) * 4;
      if (Math.abs(k) < 0.001) return x;
      const sig = v => 1 / (1 + Math.exp(-k * (v - 0.5)));
      return (sig(x) - sig(0)) / (sig(1) - sig(0));
    }
    function tcBump(x, center, width) {
      const d = (x - center) / width;
      return Math.exp(-d * d * 4);
    }
    function toneCurveY(x, curve) {
      let y = tcContrastCurve(x, curve.contrast);
      y += (curve.shadows / 9) * 0.18 * tcBump(x, 0.28, 0.28);
      y += (curve.highlights / 9) * 0.18 * tcBump(x, 0.72, 0.28);
      const fadeAmt = (curve.fade / 9) * 0.22;
      y = y * (1 - fadeAmt) + fadeAmt * tcBump(x, 0, 0.5);
      return Math.max(0, Math.min(1, y));
    }

    const TC_POINTS = [
      { key: "fade", x: 0.0, min: 0, max: 9, label: "Blacks" },
      { key: "shadows", x: 0.28, min: -9, max: 9, label: "Shadows" },
      { key: "highlights", x: 0.72, min: -9, max: 9, label: "Highlights" },
    ];

    function drawToneCurve() {
      const canvas = document.getElementById("toneCurveCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const gx = w * i / 4, gy = h * i / 4;
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
      }
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.strokeRect(0.5, 0.5, w - 1, h - 1);

      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) {
        const x = i / 100;
        const y = toneCurveY(x, curveState);
        const px = x * w, py = h - y * h;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Fixed "Whites" corner -- Sony has no independent whites control,
      // shown only as a visual anchor matching the reference curve grid.
      ctx.beginPath();
      ctx.arc(w, 0, 5, 0, Math.PI * 2);
      ctx.fillStyle = "#888";
      ctx.fill();

      for (const p of TC_POINTS) {
        const y = toneCurveY(p.x, curveState);
        const px = p.x * w, py = h - y * h;
        ctx.beginPath();
        ctx.arc(px, py, 7, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    function updateToneCurveReadout() {
      const el = document.getElementById("toneCurveReadout");
      if (el) el.textContent =
        `Contrast ${curveState.contrast} · Highlights ${curveState.highlights} · Shadows ${curveState.shadows} · Blacks/Fade ${curveState.fade}`;
      const contrastSlider = document.getElementById("contrastSlider");
      if (contrastSlider) contrastSlider.value = curveState.contrast;
    }

    function setupToneCurveInteraction() {
      const canvas = document.getElementById("toneCurveCanvas");
      if (!canvas) return;
      let dragPoint = null, dragStartY = 0, dragStartVal = 0;

      function pos(evt) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (evt.clientX - rect.left) / rect.width * canvas.width,
          y: (evt.clientY - rect.top) / rect.height * canvas.height,
        };
      }
      function findPoint(px) {
        let closest = null, closestDist = Infinity;
        for (const p of TC_POINTS) {
          const d = Math.abs(px - p.x * canvas.width);
          if (d < closestDist) { closestDist = d; closest = p; }
        }
        return closestDist < 40 ? closest : null;
      }
      canvas.addEventListener("pointerdown", (evt) => {
        const p = pos(evt);
        const point = findPoint(p.x);
        if (!point) return;
        dragPoint = point;
        dragStartY = p.y;
        dragStartVal = curveState[point.key];
        canvas.setPointerCapture(evt.pointerId);
      });
      canvas.addEventListener("pointermove", (evt) => {
        if (!dragPoint) return;
        const p = pos(evt);
        const dy = dragStartY - p.y;
        const range = dragPoint.max - dragPoint.min;
        let newVal = dragStartVal + (dy / canvas.height) * range * 1.6;
        newVal = Math.max(dragPoint.min, Math.min(dragPoint.max, Math.round(newVal)));
        if (curveState[dragPoint.key] !== newVal) {
          curveState[dragPoint.key] = newVal;
          drawToneCurve();
          updateToneCurveReadout();
        }
      });
      function finish() {
        dragPoint = null;
      }
      canvas.addEventListener("pointerup", finish);
      canvas.addEventListener("pointercancel", finish);
    }

    function onContrastSliderInput() {
      curveState.contrast = parseInt(document.getElementById("contrastSlider").value, 10);
      drawToneCurve();
      updateToneCurveReadout();
    }

    // Quick-option buttons matching the standard "Basic Curves" cheat
    // sheet (increase contrast / lifted shadows / increase highlights /
    // increase shadows), plus a reset back to neutral.
    function applyToneCurvePreset(contrast, highlights, shadows, fade) {
      curveState = { contrast, highlights, shadows, fade };
      drawToneCurve();
      updateToneCurveReadout();
    }

    // Replicates the camera's own White Balance Adjustment grid: a 15x15
    // biaxial A-B/G-M picker, -7..+7 on each axis (whole steps only -- the
    // camera's screen shows the same 15-line grid). Corner colors are an
    // approximation of the camera's rainbow-ish grid, not a calibrated
    // color space -- this is a UI nicety, unrelated to the real calibration
    // (192=neutral, 4 raw units/step) already confirmed against hardware.
    const WB_GRID_MIN = -7, WB_GRID_MAX = 7;
    const WB_GRID_N = WB_GRID_MAX - WB_GRID_MIN + 1;

    function wbGridLerp(a, b, t) { return a + (b - a) * t; }
    function wbGridCornerColor(xt, yt) {
      const c00 = [70, 190, 190];   // B, G (top-left)
      const c10 = [190, 210, 60];   // A, G (top-right)
      const c01 = [90, 90, 220];    // B, M (bottom-left)
      const c11 = [210, 70, 160];   // A, M (bottom-right)
      const top = [0, 1, 2].map(i => wbGridLerp(c00[i], c10[i], xt));
      const bot = [0, 1, 2].map(i => wbGridLerp(c01[i], c11[i], xt));
      return [0, 1, 2].map(i => wbGridLerp(top[i], bot[i], yt));
    }

    function drawWbGrid(ab, gm) {
      const canvas = document.getElementById("wbGridCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const size = canvas.width;
      const cell = size / WB_GRID_N;

      for (let row = 0; row < WB_GRID_N; row++) {
        for (let col = 0; col < WB_GRID_N; col++) {
          const xt = col / (WB_GRID_N - 1);
          const yt = row / (WB_GRID_N - 1);
          const [r, g, b] = wbGridCornerColor(xt, yt);
          ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
          ctx.fillRect(col * cell, row * cell, cell + 1, cell + 1);
        }
      }

      ctx.strokeStyle = "rgba(0,0,0,0.25)";
      ctx.lineWidth = 1;
      for (let i = 0; i <= WB_GRID_N; i++) {
        ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell); ctx.stroke();
      }

      // With an odd cell count (15), the true center falls in the middle
      // of the center cell, not on a cell boundary -- offset by half a
      // cell so this line actually passes through the neutral marker
      // position instead of sitting one half-cell to the left/above it.
      const centerPos = ((WB_GRID_N - 1) / 2 + 0.5) * cell;
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(centerPos, 0); ctx.lineTo(centerPos, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, centerPos); ctx.lineTo(size, centerPos); ctx.stroke();

      // Marker: col grows with A-B (B=left, A=right), row grows downward
      // as G-M goes from G (top) to M (bottom).
      const col = ab - WB_GRID_MIN;
      const row = WB_GRID_MAX - gm;
      const cx = col * cell + cell / 2;
      const cy = row * cell + cell / 2;
      ctx.beginPath();
      ctx.arc(cx, cy, cell * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = "#ff3b30";
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function updateWbGridUI() {
      const ab = (latestRecipe && latestRecipe.colorFilterAB) || 0;
      const gm = (latestRecipe && latestRecipe.colorFilterGM) || 0;
      const readout = document.getElementById("wbGridReadout");
      if (readout) {
        const abLabel = ab === 0 ? "0" : (ab > 0 ? "A" + ab : "B" + Math.abs(ab));
        const gmLabel = gm === 0 ? "0" : (gm > 0 ? "G" + gm : "M" + Math.abs(gm));
        readout.textContent = `A-B: ${abLabel}   G-M: ${gmLabel}`;
      }
      drawWbGrid(ab, gm);
    }

    function setColorFilter(ab, gm) {
      ab = Math.max(WB_GRID_MIN, Math.min(WB_GRID_MAX, ab));
      gm = Math.max(WB_GRID_MIN, Math.min(WB_GRID_MAX, gm));
      if (!latestRecipe) latestRecipe = {};
      latestRecipe.colorFilterAB = ab;
      latestRecipe.colorFilterGM = gm;
      updateWbGridUI();
    }

    function stepColorFilter(axis, delta) {
      const ab = (latestRecipe && latestRecipe.colorFilterAB) || 0;
      const gm = (latestRecipe && latestRecipe.colorFilterGM) || 0;
      if (axis === "ab") setColorFilter(ab + delta, gm);
      else setColorFilter(ab, gm + delta);
    }

    function resetColorFilter() {
      setColorFilter(0, 0);
    }

    function setupWbGridInteraction() {
      const canvas = document.getElementById("wbGridCanvas");
      if (!canvas) return;
      function handle(evt) {
        evt.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const point = evt.touches ? evt.touches[0] : evt;
        const x = (point.clientX - rect.left) / rect.width * canvas.width;
        const y = (point.clientY - rect.top) / rect.height * canvas.height;
        const cell = canvas.width / WB_GRID_N;
        let col = Math.floor(x / cell);
        let row = Math.floor(y / cell);
        col = Math.max(0, Math.min(WB_GRID_N - 1, col));
        row = Math.max(0, Math.min(WB_GRID_N - 1, row));
        setColorFilter(col + WB_GRID_MIN, WB_GRID_MAX - row);
      }
      canvas.addEventListener("click", handle);
      canvas.addEventListener("touchstart", handle);
    }

    // Builds the Creative Look sliders into #sliders -- called each time the
    // Custom tab is rendered (that element only exists while that tab is
    // active), not just once at page load like it used to when this section
    // was always on the page.
    // Saturation is color/tone-related and stays under the Tone Curve
    // section; Sharpness/Sharpness Range/Clarity are texture/detail
    // controls, unrelated to tone, so they render into a separate
    // "Detail" section instead.
    function buildSliders() {
      const sliderTargets = { sharpness: "detailSliders", sharpnessRange: "detailSliders", clarity: "detailSliders" };
      const containers = {};
      for (const [key, label, min, max] of fields) {
        const targetId = sliderTargets[key] || "sliders";
        if (!containers[targetId]) {
          const el = document.getElementById(targetId);
          if (!el) continue;
          el.innerHTML = "";
          containers[targetId] = el;
        }
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <label>${label}</label>
          <input type="range" id="${key}" min="${min}" max="${max}" value="0">
          <span class="val" id="${key}Val">0</span>
        `;
        containers[targetId].appendChild(row);
        const input = row.querySelector("input");
        const val = row.querySelector(".val");
        input.addEventListener("input", () => { val.textContent = input.value; });
      }
    }

    async function api(path, opts) {
      const res = await fetch(path, opts);
      return res.json();
    }

    // A brief, auto-dismissing confirmation banner ("Saved to camera",
    // "Loaded from camera", ...) -- for successful actions, complementing
    // the existing failure alert()s rather than replacing the blocking
    // alert()s some actions still use for their own success message.
    let toastTimer = null;
    function showToast(message) {
      const el = document.getElementById("toast");
      document.getElementById("toastText").textContent = message;
      el.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function setStatus(connected, model) {
      document.getElementById("dot").classList.toggle("on", connected);
      document.getElementById("statusText").textContent = connected ? model : "Not connected";
    }

    // Whether this server is running on the Pi field kit vs. a Docker/NAS
    // deployment (server reports this via /api/status's "platform" field,
    // set from the CAMERALINK_PLATFORM env var -- see scripts/cameralink.service).
    // Only the Pi build has a physical power button/relay to shut down;
    // "Shut Down Pi" on a container would shut down the NAS or Mac host
    // instead, so the Setup tab only shows it once this is known true.
    let isPi = false;

    async function pollStatus() {
      const s = await api("/api/status");
      setStatus(s.connected, s.model);
      const wasPi = isPi;
      isPi = s.platform === "pi";
      if (isPi !== wasPi && activeTab === SETUP_TAB) renderTabContent();
    }

    function toggleNetForm() {
      document.getElementById("netform").classList.toggle("open");
    }

    async function findCameraIp() {
      const mac = document.getElementById("netMac").value.trim();
      const statusEl = document.getElementById("findStatus");
      if (!mac) { statusEl.textContent = "Enter a MAC address first."; return; }
      statusEl.textContent = "Searching CameraBrdg...";
      const r = await api("/api/network/find?mac=" + encodeURIComponent(mac));
      if (r.found) {
        document.getElementById("netIp").value = r.ip;
        statusEl.textContent = "Found at " + r.ip;
      } else {
        statusEl.textContent = "Not found -- is the camera joined to CameraBrdg?";
      }
    }

    async function doConnectNetwork(body) {
      document.getElementById("statusText").textContent = "Connecting...";
      logLine("Connecting to " + (body.name || body.ip) + "...");
      logLine("  IP: " + body.ip + (body.mac ? "   MAC: " + body.mac : ""));
      logLine("  User: " + (body.userId || "(none)"));
      const startedAt = performance.now();
      const r = await api("/api/connect/network", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const elapsedMs = Math.round(performance.now() - startedAt);
      if (!r.success) {
        alert("Connect failed: " + r.error);
        logLine("Connect FAILED after " + elapsedMs + "ms");
        logLine("  Error: " + r.error);
      }
      await pollStatus();
      if (r.success) {
        await refresh();
        loadCameraInfo();
        const status = document.getElementById("statusText").textContent;
        logLine("Connected in " + elapsedMs + "ms -- " + status);
        showToast("Connected to " + status);
      }
      logLine("");
    }

    async function connectNetwork() {
      await doConnectNetwork({
        ip: document.getElementById("netIp").value,
        mac: document.getElementById("netMac").value,
        userId: document.getElementById("netUser").value,
        password: document.getElementById("netPass").value,
      });
    }

    // Saved camera profiles (name/ip/mac/userId/password) come from the
    // server's saved_cameras.json -- gitignored, never committed, so no
    // real credentials ever end up in this file or in git history.
    async function loadSavedCameras() {
      const saved = await api("/api/network/saved");
      const el = document.getElementById("savedCameras");
      if (!el) return;
      el.innerHTML = "";
      for (const cam of saved) {
        const row = document.createElement("div");
        row.className = "saved-camera-row";

        const btn = document.createElement("button");
        btn.className = "primary";
        btn.textContent = cam.name;
        btn.addEventListener("click", () => connectSavedCamera(cam));
        row.appendChild(btn);

        const pingBtn = document.createElement("button");
        pingBtn.className = "small";
        pingBtn.textContent = cam.name + " (Ping Test)";
        pingBtn.addEventListener("click", () => pingSavedCamera(cam));
        row.appendChild(pingBtn);

        const findBtn = document.createElement("button");
        findBtn.className = "small";
        findBtn.textContent = cam.name + " (Find Camera)";
        findBtn.addEventListener("click", () => findAndSaveCamera(cam));
        row.appendChild(findBtn);

        el.appendChild(row);
      }
    }

    // Looks up a saved camera's current IP by its MAC address (via the
    // server's ARP-table/dnsmasq-lease lookup -- see findIpByMac() in
    // main.cpp) and, if found, saves it back into this camera's saved
    // profile so Connect/Ping Test have an up-to-date address without
    // anyone needing to dig it out of the camera's own network settings.
    // Only finds a MAC this process has already seen traffic from/to (a
    // fresh ARP entry, or a DHCP lease) -- if the camera has never talked
    // to this network, "Find Camera" won't have anything to go on yet.
    async function findAndSaveCamera(cam) {
      if (!cam.mac) { logLine(cam.name + ": no MAC address saved -- can't look it up."); return; }
      logLine("Finding " + cam.name + " (MAC " + cam.mac + ")...");
      const r = await api("/api/network/find?mac=" + encodeURIComponent(cam.mac));
      if (!r.found) {
        logLine(cam.name + ": not found on this network yet. The camera needs to have connected here at least once (or try again after a Ping Test/Connect attempt).");
        logLine("");
        return;
      }
      logLine(cam.name + ": found at " + r.ip);
      if (r.ip === cam.ip) {
        logLine("(already saved with this IP)");
        logLine("");
        return;
      }
      const save = await api("/api/network/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: cam.name, ip: r.ip, mac: cam.mac, userId: cam.userId, password: cam.password }),
      });
      if (!save.success) {
        logLine("Failed to save updated IP: " + save.error);
      } else {
        logLine("Saved " + r.ip + " as " + cam.name + "'s IP.");
        await loadSavedCameras();
      }
      logLine("");
    }

    // Saved cameras (e.g. added via "Find Camera" before ever connecting,
    // or entered by hand) can have no IP yet. Rather than let Connect/Ping
    // Test fail against a blank address, ask for one on the spot and save
    // it back to this camera's profile so it's there next time too.
    // Returns false (aborting the caller) only if the user cancels.
    async function ensureCameraIp(cam) {
      if (cam.ip) return true;
      const ip = window.prompt("No IP address saved for " + cam.name + " yet. Enter its IP address:");
      if (!ip) return false;
      cam.ip = ip.trim();
      const save = await api("/api/network/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: cam.name, ip: cam.ip, mac: cam.mac, userId: cam.userId, password: cam.password }),
      });
      if (save.success) await loadSavedCameras();
      return true;
    }

    async function connectSavedCamera(cam) {
      if (!(await ensureCameraIp(cam))) return;
      await doConnectNetwork(cam);
    }

    async function pingSavedCamera(cam) {
      if (!(await ensureCameraIp(cam))) return;
      await pingTest(cam);
    }

    // Quick reachability check for a saved camera -- runs a ping from the
    // server (not the browser, which can't ping) and streams the result
    // into the Setup tab's log panel, distinct from the full PTP/IP
    // connect attempt doConnectNetwork() makes.
    async function pingTest(cam) {
      logLine("Pinging " + cam.name + " (" + cam.ip + ")...");
      const url = "/api/network/ping?ip=" + encodeURIComponent(cam.ip) + "&mac=" + encodeURIComponent(cam.mac || "");
      const r = await api(url);
      logLine(r.output.trim());
      logLine(cam.name + ": " + (r.success ? "reachable" : "unreachable"));
      if (r.success) {
        if (r.macMatch === true) {
          logLine("MAC check: matches " + cam.name + " (" + r.arpMac + ")");
        } else if (r.macMatch === false) {
          logLine("MAC check: does NOT match -- expected " + cam.mac + ", got " + r.arpMac + ". This is a different device.");
        } else {
          logLine("MAC check: unavailable (no ARP visibility on this network)");
        }
      }
      logLine("");
    }

    function logLine(text) {
      const el = document.getElementById("logOutput");
      if (!el) return;
      const time = new Date().toLocaleTimeString();
      el.textContent += "[" + time + "] " + text + "\n";
      el.scrollTop = el.scrollHeight;
    }

    function clearLog() {
      const el = document.getElementById("logOutput");
      if (el) el.textContent = "";
    }

    async function saveQuickConnect() {
      const ip = document.getElementById("netIp").value;
      const mac = document.getElementById("netMac").value;
      const userId = document.getElementById("netUser").value;
      const password = document.getElementById("netPass").value;
      if (!ip) { alert("Enter the camera's IP address first."); return; }
      const name = window.prompt("Name for this Quick Connect:", "Quick Connect");
      if (!name) return;
      const r = await api("/api/network/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, ip, mac, userId, password }),
      });
      if (!r.success) { alert("Save failed: " + r.error); return; }
      loadSavedCameras();
      showToast('Saved Quick Connect "' + name + '"');
    }

    // Camera info (battery, media slots, lens, serial) -- only meaningful
    // once connected; shows nothing if the read fails (e.g. not
    // connected yet) rather than an error block cluttering the tab.
    async function loadCameraInfo() {
      const el = document.getElementById("cameraInfo");
      if (!el) return;
      const info = await api("/api/camera-info");
      if (info.error) { el.innerHTML = ""; return; }
      el.innerHTML = `
        <h3 class="group-heading">Camera</h3>
        <div class="specs">
          <span class="spec"><b>Model</b>${info.modelName || "—"}</span>
          <span class="spec"><b>Serial</b>${info.bodySerialNumber || "—"}</span>
          <span class="spec"><b>Software Ver</b>${info.softwareVersion || "—"}</span>
          <span class="spec"><b>Battery</b>${info.batteryLevel || "—"} (${info.batteryRemain !== undefined ? info.batteryRemain + "%" : "—"})</span>
        </div>

        <h3 class="group-heading">Lens</h3>
        <div class="specs">
          <span class="spec"><b>Lens</b>${info.lensModelName || "—"}</span>
          <span class="spec"><b>Lens Ver</b>${info.lensVersionNumber || "—"}</span>
        </div>

        <h3 class="group-heading">Memory</h3>
        <div class="specs">
          <span class="spec"><b>Slot 1</b>${info.mediaSlot1Remaining !== undefined ? info.mediaSlot1Remaining + " shots" : "—"}</span>
          <span class="spec"><b>Slot 2</b>${info.mediaSlot2Remaining !== undefined ? info.mediaSlot2Remaining + " shots" : "—"}</span>
        </div>
      `;
    }

    // The API's read-side white balance names (e.g. "Color Temp",
    // the various Fluorescent_* variants, Custom slots) don't all line up
    // 1:1 with the write-side names the <select> above offers -- this maps
    // a read-back name onto the closest editable mode. Custom/Underwater
    // Auto fall back to AWB since the write path doesn't support them either.
    const wbModeFromReadName = {
      "AWB": "AWB", "Daylight": "Daylight", "Shade": "Shade", "Cloudy": "Cloudy",
      "Tungsten": "Tungsten", "Fluorescent": "Fluorescent",
      "Fluorescent (Warm White)": "Fluorescent", "Fluorescent (Cool White)": "Fluorescent",
      "Fluorescent (Day White)": "Fluorescent", "Fluorescent (Daylight)": "Fluorescent",
      "Flash": "Flash", "Color Temp": "ColorTemp",
      "Custom 1": "AWB", "Custom 2": "AWB", "Custom 3": "AWB", "Custom": "AWB",
      "Underwater Auto": "AWB",
    };

    // Cached so switching to the Custom tab can populate it immediately
    // from the last known state, without waiting on a fresh fetch -- and so
    // refresh() itself works fine even when called while some other tab
    // (Setup, or a preset group) is active and the Custom tab's form
    // elements don't currently exist in the DOM at all.
    let latestRecipe = null;

    function applyRecipeToCustomForm() {
      const presetEl = document.getElementById("preset");
      if (!presetEl || !latestRecipe) return;
      const recipe = latestRecipe;
      presetEl.value = recipe.preset || "ST";
      for (const [key] of fields) {
        if (recipe[key] !== undefined) {
          document.getElementById(key).value = recipe[key];
          document.getElementById(key + "Val").textContent = recipe[key];
        }
      }
      document.getElementById("wbMode").value = wbModeFromReadName[recipe.whiteBalanceMode] || "AWB";
      if (recipe.whiteBalanceColorTempK !== undefined) document.getElementById("wbColorTempK").value = recipe.whiteBalanceColorTempK;
      if (recipe.iso !== undefined) document.getElementById("iso").value = recipe.iso;
      if (recipe.aspectRatio !== undefined) document.getElementById("aspectRatio").value = recipe.aspectRatio;
      if (recipe.fileType !== undefined) document.getElementById("fileType").value = recipe.fileType;
      curveState = {
        contrast: recipe.contrast || 0,
        highlights: recipe.highlights || 0,
        shadows: recipe.shadows || 0,
        fade: recipe.fade || 0,
      };
      drawToneCurve();
      updateToneCurveReadout();
      updateWbGridUI();
    }

    async function refresh() {
      const recipe = await api("/api/recipe");
      if (recipe.error) { console.warn(recipe.error); return; }
      latestRecipe = recipe;
      applyRecipeToCustomForm();
    }

    // Wraps refresh() with a success toast -- used only by the Custom tab's
    // explicit "Load from Camera" button, not refresh()'s other internal
    // callers (tab-render, post-connect), which would otherwise spam a
    // toast on every tab switch.
    async function refreshWithToast() {
      await refresh();
      showToast("Loaded from camera");
    }

    // Setup tab's "Refresh" button -- refreshes everything actually visible
    // there (connection status, Camera/Lens/Memory info), plus pre-loads
    // the Custom tab's cached recipe so it's current when you switch to it.
    // refresh() alone (as used above) only does the latter, which used to
    // leave this button doing nothing visible on the Setup tab itself.
    async function setupRefresh() {
      await pollStatus();
      await loadCameraInfo();
      await refresh();
      showToast("Refreshed");
    }

    // Reads the Custom tab's current form/UI state into a plain recipe
    // object -- shared by the "Save" (push to camera) and "Save Recipe"
    // (write to a Saved Recipes slot) actions so they can't drift apart.
    function buildRecipeBody() {
      const presetEl = document.getElementById("preset");
      if (!presetEl) return null; // Custom tab isn't showing
      const body = { preset: presetEl.value };
      for (const [key] of fields) {
        body[key] = parseInt(document.getElementById(key).value, 10);
      }
      body.contrast = curveState.contrast;
      body.highlights = curveState.highlights;
      body.shadows = curveState.shadows;
      body.fade = curveState.fade;
      body.whiteBalanceMode = document.getElementById("wbMode").value;
      if (document.getElementById("wbColorTempK").value !== "") body.whiteBalanceColorTempK = parseInt(document.getElementById("wbColorTempK").value, 10);
      body.colorFilterAB = (latestRecipe && latestRecipe.colorFilterAB) || 0;
      body.colorFilterGM = (latestRecipe && latestRecipe.colorFilterGM) || 0;
      const isoVal = document.getElementById("iso").value;
      body.iso = isoVal === "Auto" ? "Auto" : parseInt(isoVal, 10);
      body.aspectRatio = document.getElementById("aspectRatio").value;
      body.fileType = document.getElementById("fileType").value;
      return body;
    }

    async function pushRecipe() {
      const body = buildRecipeBody();
      if (!body) return;
      const r = await api("/api/recipe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.success) alert("Push failed: " + r.error);
      else showToast("Saved to camera");
    }

    async function saveAsNewRecipe() {
      const body = buildRecipeBody();
      if (!body) return;
      const name = prompt("Name this recipe:");
      if (!name) return;
      const r = await api("/api/recipes/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, recipe: body }),
      });
      if (!r.success) { alert("Save failed: " + r.error); return; }
      showToast('Saved "' + name + '" to slot ' + (r.slot + 1));
    }

    async function updateEditingSlot() {
      if (editingRecipeSlot === null) return;
      const body = buildRecipeBody();
      if (!body) return;
      const existing = savedRecipes.find((r) => r.slot === editingRecipeSlot);
      const name = (existing && existing.name) || ("Slot " + (editingRecipeSlot + 1));
      const r = await api("/api/recipes/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slot: editingRecipeSlot, name, recipe: body }),
      });
      if (!r.success) { alert("Update failed: " + r.error); return; }
      showToast('Updated slot ' + (editingRecipeSlot + 1));
      editingRecipeSlot = null;
      activeTab = SAVED_RECIPES_TAB;
      renderTabs();
      renderTabContent();
    }

    function cancelEditingSlot() {
      editingRecipeSlot = null;
      activeTab = SAVED_RECIPES_TAB;
      renderTabs();
      renderTabContent();
    }

    // Shortens the long group names from /api/presets into tab labels that
    // fit a compact segmented control -- the group names themselves stay
    // full-length everywhere else (e.g. server-side, and if referenced in
    // logs), this is purely a display trim for the tab bar.
    const groupTabLabels = {
      "Film Recipe Chart": "Film Recipes",
    };

    const SETUP_TAB = "__setup__";
    const CUSTOM_TAB = "__custom__";
    const SAVED_RECIPES_TAB = "__saved__";
    let presetGroups = new Map();
    let activeTab = CUSTOM_TAB;
    let savedRecipes = [];
    // When set (by "Edit" on a Saved Recipes card), the Custom tab loads this
    // recipe instead of pulling from the camera, and shows an "Update Slot"
    // button that writes back to this slot number instead of "Save Recipe".
    let pendingRecipeLoad = null;
    let editingRecipeSlot = null;

    async function loadPresets() {
      const presets = await api("/api/presets");
      presetGroups = new Map();
      for (const p of presets) {
        const g = p.group || "Presets";
        if (!presetGroups.has(g)) presetGroups.set(g, []);
        presetGroups.get(g).push(p);
      }
      renderTabs();
      renderTabContent();
    }

    function renderTabs() {
      const tabsEl = document.getElementById("mainTabs");
      tabsEl.innerHTML = "";
      const tabKeys = [CUSTOM_TAB, SAVED_RECIPES_TAB, ...presetGroups.keys(), SETUP_TAB];
      for (const key of tabKeys) {
        const btn = document.createElement("button");
        btn.textContent = key === SETUP_TAB ? "Setup" : key === CUSTOM_TAB ? "Custom" : key === SAVED_RECIPES_TAB ? "Saved Recipes" : (groupTabLabels[key] || key);
        btn.className = key === activeTab ? "active" : "";
        btn.addEventListener("click", () => {
          activeTab = key;
          renderTabs();
          renderTabContent();
        });
        tabsEl.appendChild(btn);
      }
    }

    function renderTabContent() {
      const container = document.getElementById("tabContent");
      container.innerHTML = "";

      if (activeTab === SETUP_TAB) {
        container.innerHTML = `
          <div class="actions" id="savedCameras"></div>

            <div class="row" style="margin:0;">
              <input id="netMac" placeholder="MAC address (optional -- only needed to look up the IP below)" style="flex:1;">
              <button class="small" onclick="findCameraIp()">Find on Network</button>
            </div>
            <span id="findStatus" class="wb"></span>
            <input id="netUser" placeholder="User ID (from camera's Access Authen. Info screen)">
            <input id="netPass" placeholder="Password" type="password">
            <button class="primary" onclick="connectNetwork()">Connect</button>
            <button class="small" onclick="saveQuickConnect()">Save as Quick Connect</button>
          </div>
          <div id="cameraInfo" style="margin-top:20px;"></div>

          ${isPi ? `
          <div class="footer">
            <button class="danger" onclick="toggleConfirm()">Shut Down Pi</button>
            <div class="confirm" id="confirm">
              This will cleanly power off the Pi. You'll need to unplug and replug power (or press its power button, if wired) to turn it back on.
              <div class="actions">
                <button class="danger" onclick="shutdownPi()">Confirm Shutdown</button>
                <button onclick="toggleConfirm()">Cancel</button>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="card-head">
              <h2 style="margin:0;">Log</h2>
              <button class="small" onclick="clearLog()">Clear</button>
            </div>
            <pre class="log-panel" id="logOutput"></pre>
          </div>
        `;
        loadSavedCameras();
        loadCameraInfo();
        return;
      }

      if (activeTab === CUSTOM_TAB) {
        container.innerHTML = `

          <h3 class="group-heading">ISO</h3>
          <div class="row">
            <label>Sensitivity</label>
            <select id="iso">
              <option value="Auto">Auto</option>
              <option value="100">100</option><option value="125">125</option><option value="160">160</option>
              <option value="200">200</option><option value="250">250</option><option value="320">320</option>
              <option value="400">400</option><option value="500">500</option><option value="640">640</option>

              <option value="12800">12800</option><option value="16000">16000</option><option value="20000">20000</option>
              <option value="25600">25600</option><option value="32000">32000</option><option value="51200">51200</option>
              <option value="102400">102400</option>
            </select>
          </div>

          <h3 class="group-heading">Other Settings</h3>
          <div class="row">
            <label>Aspect Ratio</label>
            <select id="aspectRatio">
              <option value="3:2">3:2</option>
              <option value="16:9">16:9</option>
              <option value="4:3">4:3</option>
              <option value="1:1">1:1</option>
            </select>
          </div>
          <div class="row">
            <label>File Type</label>
            <select id="fileType">
              <option value="RAW">RAW</option>
              <option value="RAW+JPEG">RAW+JPEG</option>
              <option value="JPEG">JPEG</option>
            </select>
          </div>

          <div class="actions">
            <button onclick="refreshWithToast()">Load from Camera</button>
            <button class="primary" onclick="pushRecipe()">Save to Camera</button>
            ${editingRecipeSlot !== null
              ? `<button class="primary" onclick="updateEditingSlot()">Update Slot ${editingRecipeSlot + 1}</button>
                 <button onclick="cancelEditingSlot()">Cancel Edit</button>`
              : `<button onclick="saveAsNewRecipe()">Save Recipe</button>`}
          </div>
        `;
        buildSliders();
        setupToneCurveInteraction();
        drawToneCurve();
        updateToneCurveReadout();
        setupWbGridInteraction();
        updateWbGridUI();
        if (pendingRecipeLoad) {
          latestRecipe = pendingRecipeLoad;
          pendingRecipeLoad = null;
          applyRecipeToCustomForm();
        } else {
          applyRecipeToCustomForm();
          refresh();
        }
        return;
      }

      if (activeTab === SAVED_RECIPES_TAB) {
        container.innerHTML = `<div class="meta" id="savedRecipesCount"></div><div id="savedRecipesList"></div>`;
        loadSavedRecipes();
        return;
      }

      const items = presetGroups.get(activeTab) || [];
      for (const p of items) {
        const card = document.createElement("div");
        card.className = "card";
        const metaParts = [];
        if (p.baseISO) metaParts.push("ISO " + p.baseISO);
        if (p.whiteBalanceNote) metaParts.push(p.whiteBalanceNote);
        card.innerHTML = `
          <div class="card-head">
            <span class="name">${p.name}</span>
            <span class="look">${presetNames[p.preset] || p.preset}</span>
          </div>
          ${metaParts.length ? `<div class="meta">${metaParts.join(" &middot; ")}</div>` : ""}
          ${buildSpecsHtml(p)}
          <div class="notes">${p.notes}</div>
          <button class="small primary">Save to Camera</button>
        `;
        card.querySelector("button").addEventListener("click", () => pushPreset(p));
        container.appendChild(card);
      }
    }

    // Full per-field breakdown of a preset's settings, straight from the
    // same data pushPreset() sends to the camera -- only shows fields the
    // preset actually defines (a pack with no source data for e.g.
    // sharpness just omits that chip, matching the "don't touch fields we
    // have no real data for" design already used when pushing).
    const specFieldDefs = [
      ["contrast", "Contrast"], ["highlights", "Highlights"], ["shadows", "Shadows"],
      ["fade", "Fade"], ["saturation", "Saturation"], ["sharpness", "Sharpness"],
      ["sharpnessRange", "Sharp. Range"], ["clarity", "Clarity"],
    ];
    function buildSpecsHtml(p) {
      const chips = [];
      for (const [key, label] of specFieldDefs) {
        if (p[key] !== null && p[key] !== undefined) chips.push(`<span class="spec"><b>${label}</b>${p[key]}</span>`);
      }
      if (p.whiteBalanceMode) chips.push(`<span class="spec"><b>WB</b>${p.whiteBalanceMode}</span>`);
      if (p.whiteBalanceColorTempK !== undefined) chips.push(`<span class="spec"><b>Kelvin</b>${p.whiteBalanceColorTempK}K</span>`);
      if (p.colorFilterAB !== undefined) chips.push(`<span class="spec"><b>Filter A-B</b>${p.colorFilterAB === 0 ? "0" : (p.colorFilterAB > 0 ? "A" : "B") + Math.abs(p.colorFilterAB)}</span>`);
      if (p.colorFilterGM !== undefined) chips.push(`<span class="spec"><b>Filter G-M</b>${p.colorFilterGM === 0 ? "0" : (p.colorFilterGM > 0 ? "G" : "M") + Math.abs(p.colorFilterGM)}</span>`);
      if (p.iso !== undefined) chips.push(`<span class="spec"><b>ISO</b>${p.iso}</span>`);
      if (p.aspectRatio !== undefined) chips.push(`<span class="spec"><b>Aspect</b>${p.aspectRatio}</span>`);
      if (p.fileType !== undefined) chips.push(`<span class="spec"><b>File Type</b>${p.fileType}</span>`);
      return chips.length ? `<div class="specs">${chips.join("")}</div>` : "";
    }

    async function pushPreset(p) {
      // Only include fields this preset actually defines -- omitted fields
      // (e.g. sharpness/clarity for packs with no source data for them)
      // are left untouched on the camera rather than reset to 0.
      const body = { preset: p.preset };
      const optionalFields = [
        "contrast", "highlights", "shadows", "fade", "saturation",
        "sharpness", "sharpnessRange", "clarity",
        "whiteBalanceMode", "whiteBalanceColorTempK", "colorFilterAB", "colorFilterGM", "iso",
      ];
      for (const key of optionalFields) {
        if (p[key] !== null && p[key] !== undefined) body[key] = p[key];
      }

      const r = await api("/api/recipe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.success) { alert("Push failed: " + r.error); return; }
      await refresh();
      showToast('"' + p.name + '" sent to camera');
    }

    // Builds the same "ISO 400 · Color Filter A+1 G+1" style meta line the
    // Film Recipes cards show (there, it's hand-authored per preset from
    // the source data sheet) -- computed here from a saved recipe's actual
    // iso/colorFilterAB/colorFilterGM fields so both card types read the
    // same way.
    function buildRecipeMetaLine(recipe) {
      const parts = [];
      if (recipe.iso !== undefined) parts.push("ISO " + recipe.iso);
      const ab = recipe.colorFilterAB || 0;
      const gm = recipe.colorFilterGM || 0;
      if (ab === 0 && gm === 0) {
        parts.push("No Color Filter");
      } else {
        const filterParts = [];
        if (ab !== 0) filterParts.push((ab > 0 ? "A+" : "B+") + Math.abs(ab));
        if (gm !== 0) filterParts.push((gm > 0 ? "G+" : "M+") + Math.abs(gm));
        parts.push("Color Filter " + filterParts.join(" "));
      }
      return parts.join(" &middot; ");
    }

    async function loadSavedRecipes() {
      savedRecipes = await api("/api/recipes/saved");
      if (!Array.isArray(savedRecipes)) savedRecipes = [];
      renderSavedRecipes();
    }

    function renderSavedRecipes() {
      const countEl = document.getElementById("savedRecipesCount");
      const listEl = document.getElementById("savedRecipesList");
      if (!countEl || !listEl) return; // tab isn't showing anymore
      countEl.textContent = savedRecipes.length + " of 10 slots used";
      listEl.innerHTML = "";
      const bySlot = new Map(savedRecipes.map((r) => [r.slot, r]));
      for (let slot = 0; slot < 10; slot++) {
        const entry = bySlot.get(slot);
        const card = document.createElement("div");
        card.className = "card";
        if (entry) {
          const recipe = entry.recipe || {};
          card.innerHTML = `
            <div class="card-head">
              <span class="name">${entry.name}</span>
              <span class="look">${(presetNames[recipe.preset] || recipe.preset || "Custom") + " &middot; Slot " + (slot + 1)}</span>
            </div>
            <div class="meta">${buildRecipeMetaLine(recipe)}</div>
            ${buildSpecsHtml(recipe)}
            <div class="actions">
              <button class="small primary" data-act="load">Save to Camera</button>
              <button class="small" data-act="edit">Edit</button>
              <button class="small" data-act="rename">Rename</button>
              <button class="small" data-act="delete">Delete</button>
            </div>
          `;
          card.querySelector('[data-act="load"]').addEventListener("click", () => loadSlotToCamera(entry));
          card.querySelector('[data-act="edit"]').addEventListener("click", () => editSlotInCustomTab(slot, entry));
          card.querySelector('[data-act="rename"]').addEventListener("click", () => renameSlot(slot, entry.name));
          card.querySelector('[data-act="delete"]').addEventListener("click", () => deleteSlot(slot, entry.name));
        } else {
          card.innerHTML = `
            <div class="card-head">
              <span class="name">Empty</span>
              <span class="look">Slot ${slot + 1}</span>
            </div>
          `;
        }
        listEl.appendChild(card);
      }
    }

    async function loadSlotToCamera(entry) {
      const r = await api("/api/recipe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry.recipe),
      });
      if (!r.success) { alert("Push failed: " + r.error); return; }
      showToast('"' + entry.name + '" sent to camera');
    }

    function editSlotInCustomTab(slot, entry) {
      pendingRecipeLoad = entry.recipe;
      editingRecipeSlot = slot;
      activeTab = CUSTOM_TAB;
      renderTabs();
      renderTabContent();
    }

    async function renameSlot(slot, currentName) {
      const name = prompt("Rename recipe:", currentName);
      if (!name || name === currentName) return;
      const r = await api("/api/recipes/rename", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slot, name }),
      });
      if (!r.success) { alert("Rename failed: " + r.error); return; }
      await loadSavedRecipes();
      showToast('Renamed to "' + name + '"');
    }

    async function deleteSlot(slot, name) {
      if (!confirm('Delete "' + name + '"?')) return;
      const r = await api("/api/recipes/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slot }),
      });
      if (!r.success) { alert("Delete failed: " + r.error); return; }
      await loadSavedRecipes();
      showToast('Deleted "' + name + '"');
    }

    function toggleConfirm() {
      document.getElementById("confirm").classList.toggle("open");
    }
    async function shutdownPi() {
      document.getElementById("confirm").innerHTML = "Shutting down...";
      // Body is required, not just decorative -- cpp-httplib on the server
      // rejects a POST with no Content-Length header at all with a 400,
      // and some browsers omit that header entirely for a bodyless fetch()
      // POST. Sending an explicit (empty) JSON body guarantees it's set.
      await fetch("/api/system/shutdown", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
    }

    pollStatus();
    loadPresets();
    setInterval(pollStatus, 5000);
  </script>
</body>
</html>
